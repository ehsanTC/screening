title: "ارزیابی خطر 10 ساله بیماری قلبی عروقی آترواسکلروتیک"
version: "1.0"
purpose:
 خطر حمله قلبی یا سکته مغزی را در ۱۰ سال آینده حساب می‌کند. این روش برای افراد ۴۰ تا ۷۹ ساله‌ای است که بیماری قلبی یا عروقی شناخته‌شده ندارند. فرمول آن بر اساس دستورالعمل‌های پزشکی آمریکا (ACC/AHA 2013) طراحی شده است.

type: ascvd

condition:
  - question_id: 1
    operator: greaterThan
    value: 10
  - question_id: 1
    operator: lessThanOrEquals
    value: 79

questions:
  - id: 1
    code: "age"
    text: "سن شما چقدر است؟"
    type: Number
    validation:
      min: 10
      max: 79
    validation_error: "سن باید بین 10 تا 79 سال باشد"

  - id: 2
    code: "gender"
    text: "جنیست خود را انتخاب کنید"
    type: single_choice
    options:
      - text: "زن"
        value: Female
      - text: "مرد"
        value: Male
    save:
      path: "gender"
      cast: string

  - id: 3
    code: "cholesterol"
    text: "کلسترول کل"
    type: number
    unit_options:
      - mg/dL
      - mmol/L
    save:
      path: "cholesterol"
      cast: int

  - id: 4
    code: "hdl"
    text: "HDL کلسترول"
    type: number
    unit_options:
      - mg/dL
      - mmol/L
    save:
      path: "hdl"
      cast: int

  - id: 5
    code: "systolic-blood-pressure"
    text: "فشار خون سیستولیک (عدد بالایی)"
    type: number
    unit: mmHg
    validation:
      min: 90
      max: 200
    validation_error: "فشار خون سیستولیک شما باید بین 90 تا 200 باشد"
    save:
      path: "systolic-blood-pressure"
      cast: int

  - id: 6
    code: "height"
    text: "قد خود را به متر وارد کنید"
    type: Number
    save:
      path: "height"
      cast: float
      unit: "m"
    validation:
      min: 1.5
      max: 2.2
    validation_error: "قد شما باید در محدوده 1.5 تا 2.2 متر باشد"

  - id: 7
    code: "weight"
    text: "وزن شما چند کیلوگرم است؟"
    type: Number
    save:
      path: "weight"
      cast: float
      unit: "kg"
    validation:
      min: 50
      max: 150
    validation_error: "وزن شما باید در محدوده 50 تا 150 کیلوگرم باشد."

  - id: 8
    code: "egfr"
    text: "مقدار eGFR خود را وارد کنید"
    type: number
    unit: (mL/min/1.73 m²)
    validation:
      min: 15
      max: 140
    validation_error: "eGFR باید بین 15 تا 140 باشد"
    save:
      path: "egfr"
      cast: int

  - id: 9
    code: "lipid-lowering-medication"
    text: "آیا از داروهای کاهش چربی خون استفاده می‌کنید؟"
    type: single_choice
    options:
      - text: "بله"
        value: yes

      - text: "خیر"
        value: no

  - id: 10
    code: "blood-pressure-medication"
    text: "آیا فشار خون دارید؟"
    type: single_choice
    options:
      - text: "بله"
        value: yes

      - text: "خیر"
        value: no
    save:
      path: "blood-pressure-medication"
      cast: bool

  - id: 11
    code: "smoking"
    text: "آیا سیگار می‌کشید؟"
    type: single_choice
    options:
      - text: "بله"
        value: yes

      - text: "خیر"
        value: no

    save:
      path: "smoking"
      cast: "bool"

  - id: 12
    code: "diabetes"
    text: "آیا دیابت دارید؟"
    type: single_choice
    options:
      - text: "بله"
        value: yes

      - text: "خیر"
        value: no

    save:
      path: "diabetes"
      cast: int

  - id: 13
    code: "uacr"
    text: "مقدار UACR خود را وارد کنید"
    type: number
    unit: (mg/g)
    required: false
    validation:
      min: 0
      max: 25000
    validation_error: "مقدار UACR باید بین 0 تا 25000 باشد"

    save:
      path: "uacr"
      cast: int

  - id: 14
    code: "hba1c"
    text: "مقدار قند سه ماهه (HbA1c) خود را وارد کنید"
    type: number
    required: false
    validation:
      min: 3
      max: 15
    validation_error: "مقدار قند سه ماه باید بین 3 تا 15 باشد"
    save:
      path: "hba1c"
      cast: int

  - id: 15
    code: "wealth-level"
    text: "میزان درآمد خود را مشخص کنید"
    type: single_choice
    required: false
    options:
      - text: "بهره‌مند"
        value: "rich"

      - text: "متوسط"
        value: "middle"

      - text: "کم برخوردار"
        value: "poor"
    save:
      path: "wealth-level"
      cast: string

results:
  - value: low
    text: "خطر پایین"
    subtitle: "<5%"
    conditions:
      - operator: lessThan
        value: 5
    description: "خطر ۱۰ ساله کمتر از ۵٪ است"
    color: "#4CAF50"
    icon: "🟢"
    prevention:
      primordial:
        - "رژیم غذایی سالم را حفظ کنید (به سبک مدیترانه‌ای)"
        - "فعالیت بدنی منظم (حداقل ۱۵۰ دقیقه در هفته)"
        - "وزن سالم را حفظ کنید (BMI بین ۱۸.۵ تا ۲۴.۹)"
        - "از دخانیات و الکل اجتناب کنید"
      primary:
        - "غربالگری‌های معمول سلامت را ادامه دهید"
        - "فشار خون و کلسترول را سالانه بررسی کنید"
        - "عادات سبک زندگی سالم را حفظ کنید"
      secondary:
        - "معمولاً در این سطح از خطر مورد نیاز نیست"
        - "پایش تغییرات عوامل خطر را ادامه دهید"
    summary: "خطر ۱۰ ساله ASCVD شما {0:F1}٪ است که در دسته خطر پایین قرار می‌گیرد. سبک زندگی سالم فعلی و مراقبت‌های پیشگیرانه معمول خود را ادامه دهید."
    next_steps: |
      1. سبک زندگی سالم فعلی خود را ادامه دهید
      2. با ارائه‌دهندهٔ مراقبت‌های درمانی خود، پیگیری منظم داشته باشید
      3. خطر دیابت را در ۳ تا ۵ سال آینده یا در صورت تغییر وضعیت سلامتی، مجدد ارزیابی کنید
    follow_up: "خطر دیابت را در ۳ تا ۵ سال آینده یا در صورت تغییر وضعیت سلامتی، مجدد ارزیابی کنید"
    patient_education: |
      • شما در ۱۰ سال آینده خطر پایینی برای ابتلا به بیماری قلبی دارید
      • به رژیم غذایی سالم برای قلب ادامه دهید
      • از نظر جسمی فعال بمانید
      • سیگار نکشید و الکل مصرف نکنید
      • معاینات سالانه را به‌موقع انجام دهید

  - value: borderline
    text: "خطر مرزی"
    subtitle: "5 - 7.4%"
    conditions:
      - operator: GreaterThanOrEquals
        value: 5
      - operator: LessThan
        value: 7.4
    description: "خطر ۱۰ ساله بین ۵٪ تا ۷.۴٪ است"
    color: "#FFC107"
    icon: "🟢"
    prevention:
      primordial:
        - "تغییرات رژیم غذایی را تشدید کنید (رژیم مدیترانه‌ای)"
        - "فعالیت بدنی را افزایش دهید (۱۵۰ تا ۳۰۰ دقیقه در هفته)"
        - "به وزن سالم برسید و آن را حفظ کنید"
        - "در صورت مصرف سیگار، ترک سیگار را در نظر بگیرید"
        - "از تکنیک‌های مدیریت استرس استفاده کنید"
      primary:
        - "عوامل خطر را با دفعات بیشتری پایش کنید"
        - "امتیازدهی کلسیم عروق کرونر (CAC) را در نظر بگیرید"
        - "سابقه خانوادگی بیماری قلبی‌عروقی زودرس را ارزیابی کنید"
        - "فشار خون و چربی‌های خون را هر ۶ ماه بررسی کنید"
      secondary:
        - "معمولاً در این سطح از خطر توصیه نمی‌شود"
        - "از نظر پیشرفت به سطوح بالاتر خطر پایش کنید"
    summary: "خطر ۱۰ ساله ASCVD شما {0:F1}٪ است که در دسته خطر مرزی قرار می‌گیرد. اکنون زمان مناسبی برای تشدید اصلاحات سبک زندگی و گفت‌وگو با پزشک درباره مدیریت عوامل خطر است."
    next_steps: |
      1. برای بحث دربارهٔ خطر، با ارائه‌دهندهٔ مراقبت‌های درمانی خود صحبت کنید
      2. انجام امتیازدهی کلسیم عروق کرونر (CAC) را برای دقیق‌تر کردن ارزیابی خطر مد نظر قرار دهید
      3. اصلاحات سبک زندگی را بررسی کنید و اهداف مشخصی تعیین کنید
      4. ارزیابی خطر را ۶ تا ۱۲ ماه دیگر مجددا انجام دهید
    follow_up: "Reassess risk in 6-12 months after implementing lifestyle changes"
    patient_education: |
      • خطر شما افزایش یافته اما همچنان قابل کنترل است
      • تغییرات سبک زندگی در این مرحله قدرتمندترین ابزار موجود است
      • تغییرات کوچک می‌توانند تفاوت بزرگی ایجاد کنند
      • با ارائه‌دهندهٔ مراقبت‌های درمانی خود برای تنظیم یک برنامه همکاری کنید

  - value: intermediate
    text: "خطر متوسط"
    subtitle: "7.5-19.9%"
    conditions:
      - operator: GreaterThanOrEquals
        value: 7.5
      - operator: LessThan
        value: 19.9
    description: "خطر ۱۰ ساله بین ۷.۵٪ تا ۱۹.۹٪ است"
    color: "#FF9800"
    icon: "🟠"
    prevention:
      primordial:
        - "اصلاحات جدی و گسترده در سبک زندگی"
        - "مشاوره با متخصص تغذیه برای درمان تغذیه‌ای"
        - "در صورت نیاز، برنامه ورزشی تحت نظارت"
        - "برنامه جامع ترک سیگار"
        - "برنامه کاهش وزن در صورت اضافه‌وزن/چاقی"
      primary:
        - "پایش مکرر (هر ۳ تا ۶ ماه)"
        - "امتیازدهی کلسیم عروق کرونر (CAC) توصیه می‌شود"
        - "عوامل افزایش‌دهنده خطر اضافی را ارزیابی کنید"
        - "درمان با آسپرین را در نظر بگیرید (با پزشک مشورت کنید)"
        - "پایش جامع آزمایش‌های متابولیک"
      secondary:
        - "معمولاً در این سطح از خطر توصیه نمی‌شود"
        - "در موارد پیچیده، مشاوره با متخصص قلب را در نظر بگیرید"
    summary: "خطر ۱۰ ساله ASCVD شما {0:F1}٪ است که در دسته خطر متوسط قرار می‌گیرد. راهکارهای پیشگیرانه جدی‌تری توصیه می‌شود. انجام آزمایش‌های تکمیلی را در نظر بگیرید و درباره گزینه‌های پیشگیری با پزشک خود مشورت کنید."
    next_steps: |
      1. در سریع‌ترین زمان ممکن با ارائه‌دهندهٔ مراقبت‌های درمانی خود دیدار کنید
      2. انجام امتیازدهی کلسیم عروق کرونر (CAC) را مد نظر قرار دهید
      3. برنامهٔ جامع اصلاح سبک زندگی را آغاز کنید
      4. گزینه‌های مدیریت عوامل خطر را با پزشک خود مرور کنید
      5. برای پیگیری، ۳ تا ۶ ماه دیگر اقدام کنید
    follow_up: "Reassess risk in 3-6 months after starting prevention strategies"
    patient_education: |
      • خطر شما متوسط است و نیاز به اقدام دارد
      • تغییرات سبک زندگی ضروری هستند
      • آزمایش‌های تکمیلی می‌توانند به دقیق‌تر شدن ارزیابی خطر کمک کنند
      • گزینه‌های پیشگیری را به‌طور کامل با ارائه‌دهنده خود بررسی کنید
      • به برنامهٔ پیشگیری خود متعهد بمانید

  - value: high
    text: "خطر بالا"
    subtitle: "≥20%"
    conditions:
      - operator: GreaterThanOrEquals
        value: 20
    description: "خطر ۱۰ ساله ۲۰٪ یا بیشتر است"
    color: "#F44336"
    icon: "🔴"
    prevention:
      primordial:
        - "حداکثر مداخله در سبک زندگی"
        - "مشاوره تغذیه‌ای فشرده با متخصص تغذیه"
        - "برنامه ورزشی تحت نظارت"
        - "ترک فشرده سیگار با حمایت دارویی"
        - "برنامه جامع مدیریت وزن"
        - "کاهش استرس و حمایت از سلامت روان"
      primary:
        - "پایش دقیق هر ۱ تا ۳ ماه"
        - "امتیازدهی کلسیم عروق کرونر (CAC) را در نظر بگیرید"
        - "درمان با آسپرین را ارزیابی کنید (با پزشک مشورت کنید)"
        - "اندازه‌گیری شاخص مچ پا-بازویی (ABI)"
        - "hs-CRP و سایر نشانگرهای التهابی در صورت نیاز"
        - "مشاوره با متخصص قلب را در نظر بگیرید"
      secondary:
        - "ارجاع به متخصص قلب برای مراقبت تخصصی را در نظر بگیرید"
        - "انجام آزمایش‌های پیشرفته قلبی‌عروقی را ارزیابی کنید"
        - "در صورت وجود اندیکاسیون، درباره دفیبریلاتور قابل کاشت (ICD) با پزشک مشورت کنید"
        - "از نظر بروز علائم قلبی‌عروقی پایش شوید"
    summary: "خطر ۱۰ ساله ASCVD شما {0:F1}٪ است که در دسته خطر بالا قرار می‌گیرد. راهکارهای جامع پیشگیری به‌شدت توصیه می‌شوند. لطفاً درباره گزینه‌های مدیریت با پزشک خود مشورت کنید."
    next_steps: |
      1. در اسرع وقت با ارائه‌دهندهٔ مراقبت‌های درمانی خود وقت ملاقات بگیرید
      2. مشاوره با متخصص قلب را مد نظر قرار دهید
      3. برنامهٔ فشردهٔ اصلاح سبک زندگی را آغاز کنید
      4. همهٔ گزینه‌های پیشگیری را با پزشک خود بررسی کنید
      5. با پیگیری منظم و ویزیت مجدد طی ۱ تا ۳ ماه، تحت نظارت دقیق باشید
    follow_up: " پیگیری منظم و ارزیابی مجدد طی ۱ تا ۳ ماه آینده"
    patient_education: |
      •  خطر شما بالا است و نیاز به توجه فوری دارد
      • تغییرات فشرده در سبک زندگی حیاتی هستند
      • با تیم درمانی خود به‌دقت همکاری کنید
      • در تمام ویزیت‌های پیگیری حاضر شوید
      • هر گونه علامت جدید را فوراً گزارش دهید
