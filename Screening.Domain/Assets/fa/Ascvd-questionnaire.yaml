title: "ارزیابی خطر 10 ساله بیماری قلبی عروقی آترواسکلروتیک"
version: "1.0"
purpose:
 خطر حمله قلبی یا سکته مغزی را در ۱۰ سال آینده حساب می‌کند. این روش برای افراد ۴۰ تا ۷۹ ساله‌ای است که بیماری قلبی یا عروقی شناخته‌شده ندارند. فرمول آن بر اساس دستورالعمل‌های پزشکی آمریکا (ACC/AHA 2013) طراحی شده است.

condition:
  - question_id: 1
    operator: greaterThan
    value: 10
  - question_id: 1
    operator: lessThanOrEquals
    value: 79

questions:
  - id: 1
    code: "age"
    text: "سن شما چقدر است؟"
    type: Number
    validation:
      min: 10
      max: 79
    validation_error: "سن باید بین 10 تا 79 سال باشد"

  - id: 2
    code: "gender"
    text: "جنیست خود را انتخاب کنید"
    type: single_choice
    options:
      - text: "زن"
        value: Female
      - text: "مرد"
        value: Male

  - id: 3
    code: "cholesterol"
    text: "کلسترول کل"
    type: number
    unit_options:
      - mg/dL
      - mmol/L

  - id: 4
    code: "hdl"
    text: "HDL کلسترول"
    type: number
    unit_options:
      - mg/dL
      - mmol/L

  - id: 5
    code: "sbp"
    text: "فشار خون سیستولیک (عدد بالایی)"
    type: number
    unit: mmHg

  - id: 6
    code: "height"
    text: "قد خود را به متر وارد کنید"
    type: Number
    save:
      path: "height"
      cast: float
      unit: "m"

  - id: 7
    code: "weight"
    text: "وزن شما چند کیلوگرم است؟"
    type: Number
    save:
      path: "weight"
      cast: float
      unit: "kg"

  - id: 8
    code: "egfr"
    text: "مقدار eGFR خود را وارد کنید"
    type: number
    unit: (mL/min/1.73 m²)
    validation:
      min: 15
      max: 140
    validation_error: "eGFR باید بین 15 تا 140 باشد"

  - id: 9
    code: "on-lipid-med"
    text: "آیا از داروهای کاهش چربی خون استفاده می‌کنید؟"
    type: single_choice
    options:
      - text: "بله"
        value: yes

      - text: "خیر"
        value: no

  - id: 10
    code: "on-bp-med"
    text: "آیا فشار خون دارید؟"
    type: single_choice
    options:
      - text: "بله"
        value: yes

      - text: "خیر"
        value: no

  - id: 11
    code: "smoking"
    text: "آیا سیگار می‌کشید؟"
    type: single_choice
    options:
      - text: "بله"
        value: yes

      - text: "خیر"
        value: no

  - id: 12
    code: "diabetes"
    text: "آیا دیابت دارید؟"
    type: single_choice
    options:
      - text: "بله"
        value: yes

      - text: "خیر"
        value: no

  - id: 13
    code: "uacr"
    text: "مقدار UACR خود را وارد کنید"
    type: number
    unit: (mg/g)
    required: false
    validation:
      min: 0
      max: 25000
    validation_error: "مقدار UACR باید بین 0 تا 25000 باشد"

  - id: 14
    code: "hba1c"
    text: "مقدار قند سه ماهه (HbA1c) خود را وارد کنید"
    type: number
    required: false
    validation:
      min: 3
      max: 15
    validation_error: "مقدار قند سه ماه باید بین 3 تا 15 باشد"

  - id: 15
    code: "wealth-level"
    text: "میزان درآمد خود را مشخص کنید"
    type: single_choice
    options:
      - text: "بهره‌مند"
        value: "rich"

      - text: "متوسط"
        value: "middle"

      - text: "کم برخوردار"
        value: "poor"
    required: false
