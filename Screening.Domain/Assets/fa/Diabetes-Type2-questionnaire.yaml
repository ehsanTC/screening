title: "ارزیابی خطر دیابت"
version: "1.0"

questions:
  - id: 1
    code: "age"
    text: "سن شما چقدر است؟"
    type: Number
    save:
      path: "age"
      cast: "int"

  - id: 2
    code: "gender"
    text: "جنیست خود را انتخاب کنید"
    type: single_choice
    options:
      - text: "زن"
        value: Female
      - text: "مرد"
        value: Male
    save:
      path: "gender"
      cast: "string"

  - id: 3
    code: "gdm-macrosomia"
    text: "آیا دیابت بارداری یا سابقه تولد نوزاد با وزن بیش از 4.5 کیلو داشته‌اید؟"
    type: single_choice
    show_if:
      - question_id: 2
        operator: equals
        value: Female
    options:
      - text: "بله"
        value: yes

      - text: "خیر"
        value: no

    default_answer:
      text: "خیر"
      value: no

    save:
      path: "gestational-diabetes"
      cast: "bool"

  - id: 4
    code: "diabetes-family-history"
    text: "آیا والدین، خواهر و یا برادر شما دیابت دارند؟"
    type: single_choice
    options:
      - text: "بله"
        value: yes

      - text: "خیر"
        value: no

  - id: 5
    code: "on-bp-med"
    text: "آیا فشار خون دارید؟"
    type: single_choice
    options:
      - text: "بله"
        value: yes

      - text: "خیر"
        value: no
    save:
      path: "blood-pressure"
      cast: "bool"

  - id: 6
    code: "active-lifestyle"
    text: "آیا از نظر بدنی فعال هستید؟"
    type: single_choice
    options:
      - text: "بله"
        value: yes

      - text: "خیر"
        value: no

  - id: 7
    code: "height"
    text: "قد خود را به متر وارد کنید"
    type: Number
    save:
      path: "height"
      cast: float
      unit: "m"

  - id: 8
    code: "weight"
    text: "وزن شما چند کیلوگرم است؟"
    type: Number
    save:
      path: "weight"
      cast: float
      unit: "kg"
