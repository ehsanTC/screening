title: "ارزیابی خطر دیابت"
version: "1.0"

questions:
  - id: 1
    code: "age"
    text: "سن شما چقدر است؟"
    type: Number
    save:
      path: "age"
      cast: "int"

  - id: 2
    code: "gender"
    text: "جنیست خود را انتخاب کنید"
    type: single_choice
    options:
      - text: "زن"
        value: Female
      - text: "مرد"
        value: Male
    save:
      path: "gender"
      cast: "string"

  - id: 3
    code: "gdm-macrosomia"
    text: "آیا دیابت بارداری یا سابقه تولد نوزاد با وزن بیش از 4.5 کیلو داشته‌اید؟"
    type: single_choice
    show_if:
      - question_id: 2
        operator: equals
        value: Female
    options:
      - text: "بله"
        value: yes

      - text: "خیر"
        value: no

    default_answer:
      text: "خیر"
      value: no

    save:
      path: "gestational-diabetes"
      cast: "bool"

  - id: 4
    code: "diabetes-family-history"
    text: "آیا والدین، خواهر و یا برادر شما دیابت دارند؟"
    type: single_choice
    options:
      - text: "بله"
        value: yes

      - text: "خیر"
        value: no

  - id: 5
    code: "on-bp-med"
    text: "آیا فشار خون دارید؟"
    type: single_choice
    options:
      - text: "بله"
        value: yes

      - text: "خیر"
        value: no
    save:
      path: "blood-pressure"
      cast: "bool"

  - id: 6
    code: "active-lifestyle"
    text: "آیا از نظر بدنی فعال هستید؟"
    type: single_choice
    options:
      - text: "بله"
        value: yes

      - text: "خیر"
        value: no

  - id: 7
    code: "height"
    text: "قد خود را به متر وارد کنید"
    type: Number
    save:
      path: "height"
      cast: float
      unit: "m"

  - id: 8
    code: "weight"
    text: "وزن شما چند کیلوگرم است؟"
    type: Number
    save:
      path: "weight"
      cast: float
      unit: "kg"

results:
  - value: low
    text: "خطر پایین"
    subtitle: "امتیاز ۰ تا ۴"
    conditions:
      - operator: lessThan
        value: 5
    description: "خطر ابتلا به دیابت شما کمتر از ۵% است که نشان‌دهنده خطر پایین ابتلا به دیابت نوع ۲ است"
    color: "#4CAF50"
    icon: "🟢"
    prevention:
      primordial:
        - "عادات غذایی سالم را با تغذیه متعادل حفظ کنید"
        - "فعالیت بدنی منظم داشته باشید (حداقل ۱۵۰ دقیقه در هفته)"
        - "وزن سالم خود را حفظ کنید (BMI بین ۱۸.۵ تا ۲۴.۹)"
        - "مصرف نوشیدنی‌های شیرین و غذاهای فرآوری‌شده را محدود کنید"
        - "مقدار زیادی سبزیجات، میوه‌ها و غلات کامل مصرف کنید"
      primary:
        - "معاینات منظم سلامت را برنامه‌ریزی کنید"
        - "قند خون خود را سالانه یا طبق توصیه پزشک بررسی کنید"
        - "عادات سبک زندگی سالم را حفظ کنید"
        - "فشار خون و کلسترول خود را بررسی کنید"
      secondary:
        - "معمولاً در این سطح از خطر مورد نیاز نیست"
        - "پایش معمول تغییرات عوامل خطر را ادامه دهید"
    summary: "امتیاز خطر ابتلا به دیابت شما {0:F1} است که در دسته خطر پایین قرار می‌گیرد. برای حفظ این سطح پایین از خطر، سبک زندگی سالم و مراقبت‌های پیشگیرانه معمول خود را ادامه دهید."
    next_steps: |
      1. به حفظ عادات فعلی سبک زندگی سالم خود ادامه دهید
      2. یک معاینه معمول سلامت با پزشک خود برنامه‌ریزی کنید
      3. خطر ابتلا را طی ۱ تا ۲ سال آینده یا در صورت تغییر وضعیت سلامت خود مجدداً ارزیابی کنید
    follow_up: "خطر ابتلا را طی ۱ تا ۲ سال آینده یا زودتر در صورت بروز علائم نگران‌کننده مجدداً ارزیابی کنید"
    patient_education: |
      • خطر ابتلا به دیابت نوع ۲ در شما پایین است
      • به مصرف یک رژیم غذایی متعادل با قند محدود ادامه دهید
      • فعالیت بدنی منظم داشته باشید
      • وزن سالم خود را حفظ کنید
      • معاینات منظم سلامت را ادامه دهید

  - value: high
    text: "خطر بالا"
    subtitle: "امتیاز ≥۵"
    conditions:
      - operator: greaterThanOrEquals
        value: 5
    description: "امتیاز خطر ابتلا به دیابت شما ۵% یا بیشتر است که نشان‌دهنده افزایش خطر ابتلا به دیابت نوع ۲ است"
    color: "#F44336"
    icon: "🔴"
    prevention:
      primordial:
        - "یک رژیم غذایی پیشگیری از دیابت را انتخاب کنید (با تمرکز بر غذاهای کامل، فیبر و پروتئین کم‌چرب)"
        - "فعالیت بدنی خود را به ۱۵۰ تا ۳۰۰ دقیقه در هفته افزایش دهید"
        - "به وزن سالم برسید و آن را حفظ کنید (BMI هدف کمتر از ۲۵)"
        - "نوشیدنی‌های شیرین و غذاهای بسیار فرآوری‌شده را حذف کنید"
        - "کنترل حجم وعده‌های غذایی و غذا خوردن آگاهانه را تمرین کنید"
        - "از تکنیک‌های مدیریت استرس استفاده کنید"
      primary:
        - "در اسرع وقت برای مراجعه به پزشک خود وقت بگیرید"
        - "آزمایش قند خون ناشتا یا HbA1c را انجام دهید"
        - "شرکت در برنامه پیشگیری از دیابت را در نظر بگیرید"
        - "سطح قند خون خود را طبق توصیه پزشک بررسی کنید"
        - "فشار خون و کلسترول خود را به‌طور منظم بررسی کنید"
        - "برای دریافت مشاوره به متخصص تغذیه مراجعه کنید"
      secondary:
        - "معمولاً در این سطح از خطر مورد نیاز نیست"
        - "از نظر بروز علائم پیش‌دیابت یا دیابت پایش شوید"
        - "مراجعات پزشکی با دفعات بیشتر را در نظر بگیرید"
    summary: "امتیاز خطر ابتلا به دیابت شما {0:F1} است که در دسته خطر بالا قرار می‌گیرد. این بدان معناست که خطر ابتلا به دیابت نوع ۲ در شما افزایش یافته است. اقدام از همین حالا و ایجاد تغییرات در سبک زندگی می‌تواند خطر ابتلای شما را به میزان قابل توجهی کاهش دهد."
    next_steps: |
      1. فوراً برای مراجعه به پزشک خود وقت بگیرید
      2. آزمایش‌های توصیه‌شده قند خون را انجام دهید
      3. در صورت وجود، در یک برنامه ساختاریافته پیشگیری از دیابت شرکت کنید
      4. یک برنامه جامع اصلاح سبک زندگی را آغاز کنید
      5. برای ایجاد یک برنامه غذایی شخصی‌سازی‌شده با متخصص تغذیه همکاری کنید
      6. برای ارزیابی مجدد روند پیشرفت، طی ۳ تا ۶ ماه آینده پیگیری پزشکی داشته باشید
    follow_up: "پس از اجرای تغییرات سبک زندگی، طی ۳ تا ۶ ماه آینده مجدداً ارزیابی شوید و پس از آن هر ۶ تا ۱۲ ماه یک‌بار پیگیری کنید"
    patient_education: |
      • خطر ابتلا به دیابت نوع ۲ در شما افزایش یافته است
      • تغییرات سبک زندگی می‌توانند از بروز دیابت جلوگیری کنند یا آن را به تأخیر بیندازند
      • کاهش ۵ تا ۷ درصد از وزن بدن می‌تواند خطر ابتلا را تا ۵۸٪ کاهش دهد
      • فعالیت بدنی نقش مؤثری در پیشگیری دارد
      • از نزدیک با تیم مراقبت سلامت خود همکاری کنید
      • تغییرات کوچک و پایدار به نتایج ماندگار منجر می‌شوند
