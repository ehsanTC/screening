title: "Obesity and Dyslipidemia Risk Assessment"
version: "1.0"
purpose: "غربالگری برای چاقی و خطر دیس‌لیپیدمی، بر اساس راهنمای USPSTF و NCEP ATP III."
type: obesity

questions:
  - id: 1
    code: "age"
    text: "سن شما چقدر است؟"
    type: Number
    save:
      path: "age"
      cast: "int"
    validation:
      min: 10
    validation_error: "سن شما باید بیش از 20 سال باشد."

  - id: 2
    code: "gender"
    text: "جنیست خود را انتخاب کنید"
    type: single_choice
    options:
      - text: "زن"
        value: Female
      - text: "مرد"
        value: Male
    save:
      path: "gender"
      cast: "string"

  - id: 3
    code: "height"
    text: "قد خود را به متر وارد کنید"
    type: Number
    save:
      path: "height"
      cast: float
      unit: "m"
    validation:
      min: 1.5
      max: 2.2
    validation_error: "قد شما باید در محدوده 1.5 تا 2.2 متر باشد"

  - id: 4
    code: "weight"
    text: "وزن شما چند کیلوگرم است؟"
    type: Number
    save:
      path: "weight"
      cast: float
      unit: "kg"
    validation:
      min: 50
      max: 150
    validation_error: "وزن شما باید در محدوده 50 تا 150 کیلوگرم باشد."

  - id: 5
    code: "waist-circumference"
    text: "دور کمر شما چقدر است؟ (به سانتی‌متر)"
    type: Number
    save:
      path: "waist-circumference"
      cast: float
      unit: "cm"

  - id: 6
    code: "dyslipidemia-family-history"
    text: "آیا هر یک از اعضای نزدیک خانواده‌تان (والدین، خواهر یا برادر) به بیماری قلبی، سکته مغزی، یا کلسترول بالا مبتلا هستند؟"
    type: single_choice
    options:
      - text: "بله"
        value: yes

      - text: "خیر"
        value: no

  - id: 7
    code: "diabetes"
    text: "آیا دیابت دارید؟"
    type: single_choice
    options:
      - text: "بله"
        value: yes

      - text: "خیر"
        value: no

  - id: 8
    code: "blood-pressure-medication"
    text: "آیا فشار خون دارید؟"
    type: single_choice
    options:
      - text: "بله"
        value: yes

      - text: "خیر"
        value: no

    save:
      path: "blood-pressure"
      cast: "bool"

  - id: 9
    code: "smoking"
    text: "آیا سیگار می‌کشید یا تنباکو مصرف می‌کنید؟"
    type: single_choice
    options:
      - text: "بله"
        value: yes

      - text: "خیر"
        value: no

  - id: 10
    code: "past-smoking"
    text: "آیا در گذشته سیگار می‌کشیده‌اید یا از تنباکو استفاده می‌کرده‌اید؟"
    type: single_choice
    options:
      - text: "بله"
        value: yes

      - text: "خیر"
        value: no

results:
  - value: low
    text: "خطر پایین"
    subtitle: "امتیاز ۰ تا ۱"
    conditions:
      - operator: lessThan
        value: 2
    description: "وزن و عوامل خطر شما را در دسته کم‌خطر برای مشکلات چربی‌های خون مرتبط با چاقی قرار می‌دهد"
    color: "#4CAF50"
    icon: "🟢"
    prevention:
      primordial:
        - "رژیم غذایی سالم داشته باشید (سبک مدیترانه‌ای)"
        - "فعالیت بدنی داشته باشید (۱۵۰+ دقیقه در هفته)"
        - "وزن سالم را حفظ کنید (BMI ۱۸.۵ تا ۲۴.۹)"
        - "از مصرف دخانیات خودداری کنید"
      primary:
        - "چک‌اپ‌های منظم سلامت را ادامه دهید"
        - "هر ۴ تا ۶ سال یک بار آزمایش چربی خون انجام دهید، طبق توصیه‌های عمومی"
        - "وزن و دور کمر را به‌طور دوره‌ای کنترل کنید"
      secondary:
        - "معمولاً در این سطح خطر نیازی نیست"
        - "نظارت مستمر بر تغییرات عوامل خطر را ادامه دهید"
    summary: "امتیاز خطر چاقی و چربی خون شما {0:F1} است که در دسته کم‌خطر قرار می‌گیرد. سبک زندگی سالم و مراقبت‌های پیشگیرانه معمول خود را ادامه دهید."
    next_steps: |
      ۱. ادامه دادن به سبک زندگی سالم فعلی
      ۲. برنامه‌ریزی برای چک‌اپ دوره‌ای با پزشک
      ۳. ارزیابی مجدد خطر در ۴ تا ۶ سال یا در صورت تغییر وضعیت سلامتی
    follow_up: "ارزیابی مجدد خطر در ۴ تا ۶ سال، یا زودتر در صورت تغییر وزن یا وضعیت سلامتی"
    patient_education: |
      • وزن و عوامل خطر شما در محدوده سالم قرار دارد
      • ادامه دادن به رژیم غذایی متعادل و مفید برای قلب
      • فعال بودن از نظر بدنی
      • ادامه دادن به چک‌اپ‌های منظم سلامت

  - value: borderline
    text: "خطر مرزی"
    subtitle: "امتیاز ۲ تا ۳"
    conditions:
      - operator: greaterThanOrEquals
        value: 2
      - operator: lessThan
        value: 4
    description: "شما اضافه وزن دارید یا یک یا دو عامل خطر دارید که شما را در خطر مرزی برای مشکلات چربی خون قرار می‌دهد"
    color: "#FFC107"
    icon: "🟡"
    prevention:
      primordial:
        - "تغییرات رژیم غذایی را تشدید کنید (رژیم مدیترانه‌ای)"
        - "فعالیت بدنی را به سمت ۱۵۰ تا ۳۰۰ دقیقه در هفته افزایش دهید"
        - "به سمت وزن سالم با تغییرات تدریجی و پایدار حرکت کنید"
        - "در صورت مصرف، سیگار را ترک کنید"
      primary:
        - "با پزشک خود در مورد انجام آزمایش چربی خون صحبت کنید"
        - "فشار خون و وزن را هر ۶ تا ۱۲ ماه یک بار کنترل کنید"
        - "سابقه خانوادگی و سایر عوامل خطر را با پزشک مرور کنید"
      secondary:
        - "معمولاً در این سطح خطر نیازی نیست"
        - "بررسی پیشرفت به سمت خطر بالاتر"
    summary: "امتیاز خطر چاقی و چربی خون شما {0:F1} است که در دسته خطر مرزی قرار می‌گیرد. این زمان مناسبی برای تقویت عادات سالم و بررسی کلسترول خون شماست."
    next_steps: |
      ۱. هماهنگی وقت ملاقات با پزشک
      ۲. درخواست انجام آزمایش چربی خون
      ۳. تعیین اهداف مشخص برای رژیم غذایی و فعالیت بدنی
      ۴. پیگیری مجدد در حدود ۱ سال برای ارزیابی مجدد
    follow_up: "ارزیابی مجدد خطر در حدود ۱ سال، یا زودتر در صورت تغییر وزن یا علائم"
    patient_education: |
      • خطر شما کمی بالاست اما کاملاً قابل مدیریت است
      • تغییرات کوچک و پیوسته در سبک زندگی تأثیر واقعی دارند
      • انجام آزمایش کلسترول در حال حاضر به تعیین گام‌های بعدی کمک می‌کند
      • با پزشک خود بر روی یک برنامه شخصی کار کنید

  - value: medium
    text: "خطر متوسط"
    subtitle: "امتیاز ۴ تا ۵"
    conditions:
      - operator: greaterThanOrEquals
        value: 4
      - operator: lessThan
        value: 6
    description: "شما با چاقی یا دور کمر بالا به همراه چندین عامل خطر زندگی می‌کنید که نشان‌دهنده خطر متوسط است"
    color: "#FF9800"
    icon: "🟠"
    prevention:
      primordial:
        - "یک برنامه ساختاریافته برای کاهش وزن و تغذیه را دنبال کنید"
        - "هدف‌گذاری برای فعالیت بدنی منظم و تحت نظارت"
        - "دریافت ارجاع به متخصص تغذیه را در نظر بگیرید"
        - "در صورت مصرف، برنامه ترک سیگار را تکمیل کنید"
      primary:
        - "در صورت عدم انجام، به زودی آزمایش چربی خون انجام دهید"
        - "فشار خون و قند خون را به‌طور منظم بررسی کنید"
        - "گزینه‌های مدیریت وزن را با پزشک خود بررسی کنید"
        - "دور کمر را در طول زمان کنترل کنید"
      secondary:
        - "ارجاع به برنامه مدیریت وزن را در نظر بگیرید"
        - "انجام آزمایشات بیشتر قلبی-عروقی را با پزشک خود بررسی کنید"
    summary: "امتیاز خطر چاقی و چربی خون شما {0:F1} است که در دسته خطر متوسط قرار می‌گیرد. اقدام در حال حاضر با پزشک می‌تواند به کاهش خطر مشکلات قلبی کمک کند."
    next_steps: |
      ۱. به زودی با پزشک خود وقت ملاقات هماهنگ کنید
      ۲. آزمایش چربی خون را انجام دهید
      ۳. یک برنامه ساختاریافته مدیریت وزن را شروع کنید
      ۴. پیگیری در ۳ تا ۶ ماه برای بررسی پیشرفت
    follow_up: "ارزیابی مجدد در ۳ تا ۶ ماه پس از شروع تغییرات سبک زندگی یا درمان"
    patient_education: |
      • خطر شما بالا رفته و ارزش اقدام در حال حاضر را دارد
      • کاهش وزن حتی به میزان ۵ تا ۱۰ درصد می‌تواند کلسترول شما را به طور معنی‌داری بهبود بخشد
      • نظارت منظم به شناسایی زودهنگام مشکلات کمک می‌کند
      • تیم درمانی شما می‌تواند به شما در ایجاد یک برنامه واقع‌بینانه کمک کند

  - value: high
    text: "خطر بالا"
    subtitle: "امتیاز ≥۶"
    conditions:
      - operator: greaterThanOrEquals
        value: 6
    description: "شما با چاقی یا دور کمر بالا به همراه چندین عامل خطر زندگی می‌کنید که نشان‌دهنده خطر بالا است"
    color: "#F44336"
    icon: "🔴"
    prevention:
      primordial:
        - "یک برنامه فشرده و تحت نظارت مدیریت وزن را شروع کنید"
        - "با متخصص تغذیه بر روی یک برنامه غذایی شخصی‌سازی شده کار کنید"
        - "در صورت مصرف، سیگار را با حمایت حرفه‌ای ترک کنید"
        - "مدیریت استرس و خواب کافی داشته باشید"
      primary:
        - "در اسرع وقت آزمایش چربی خون انجام دهید"
        - "فشار خون و قند خون را به‌دقت کنترل کنید"
        - "گزینه‌های درمان کاهش کلسترول را با پزشک خود بررسی کنید"
        - "غربالگری برای بیماری‌های مرتبط مانند دیابت و فشار خون بالا"
      secondary:
        - "ارجاع به متخصص چاقی یا قلب و عروق را در نظر بگیرید"
        - "در صورت نیاز، انجام آزمایشات بیشتر قلبی-عروقی را بررسی کنید"
    summary: "امتیاز خطر چاقی و چربی خون شما {0:F1} است که در دسته خطر بالا قرار می‌گیرد. لطفاً در اسرع وقت با پزشک خود در مورد انجام آزمایش‌ها و برنامه درمانی صحبت کنید."
    next_steps: |
      ۱. در اسرع وقت با پزشک خود وقت ملاقات هماهنگ کنید
      ۲. آزمایش چربی خون و سایر آزمایشات مرتبط را انجام دهید
      ۳. یک برنامه جامع مدیریت وزن و درمان را شروع کنید
      ۴. پیگیری در ۳ ماه برای بررسی پیشرفت
    follow_up: "نظارت دقیق، با ارزیابی مجدد در ۳ ماه"
    patient_education: |
      • خطر شما بالا است و نیاز به توجه فوری دارد
      • انجام آزمایش کلسترول و چک‌آپ کامل به شدت توصیه می‌شود
      • مدیریت وزن می‌تواند خطر شما را به طور قابل توجهی کاهش دهد
      • با تیم درمانی خود همکاری نزدیک داشته باشید و در پیگیری‌ها شرکت کنید
      • هر گونه علائم جدید مانند درد قفسه سینه یا تنگی نفس را فوراً گزارش دهید
