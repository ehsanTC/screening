title: "10-Year Atherosclerotic Cardiovascular Disease (ASCVD) Risk Assessment"
version: "1.0"
purpose:
  Estimates 10-year risk of a first heart attack, stroke, or related cardiovascular
  event using the 2013 ACC/AHA Pooled Cohort Equations. Intended for adults aged
  40–79 years without known cardiovascular disease.

condition:
  - questionId: 1
    operator: greaterThan
    value: 10
  - questionId: 1
    operator: lessThanOrEquals
    value: 79

questions:
  - id: 1
    code: "age"
    text: "What is your age?"
    type: number
    validation:
      min: 10
      max: 79
    validation_error: "Age must be between 10 and 79 years"

  - id: 2
    code: "gender"
    text: "What is your gender?"
    type: single_choice
    options:
      - text: Female
        value: Female
      - text: Male
        value: Male

  - id: 3
    code: "race"
    text: "Select your Race/Ethnicity"
    type: single_choice
    options:
      - text: White
        value: white
      - text: African American / Black
        value: black

  - id: 4
    code: "cholesterol"
    text: "Total Cholesterol"
    type: number
    unit_options:
      - mg/dL
      - mmol/L

  - id: 5
    code: "hdl"
    text: "HDL Cholesterol"
    type: number
    unit_options:
      - mg/dL
      - mmol/L

  - id: 6
    code: "sbp"
    text: "Systolic Blood Pressure (top number)"
    type: number
    unit: mmHg

  - id: 7
    code: "egfr"
    text: "Your eGFR (mL/min/1.73 m²) value"
    type: number
    unit: (mL/min/1.73 m²)
    validation:
      min: 15
      max: 140
    validation_error: "eGFR must be between 15 and 140"

  - id: 8
    code: "on-bp-med"
    text: "Are you currently taking medication to treat high blood pressure?"
    type: single_choice
    options:
      - text: Yes
        value: yes

      - text: No
        value: no

  - id: 9
    code: "smoking"
    text: "Are you Smoking?"
    type: single_choice
    options:
      - text: Yes
        value: yes

      - text: No
        value: no

  - id: 10
    code: "diabetes"
    text: "Do you have a history of diabetes?"
    type: single_choice
    options:
      - text: Yes
        value: yes

      - text: No
        value: no

  - id: 11
    code: "uacr"
    text: "What is the value of your UACR (mg/g)?"
    type: number
    unit: (mg/g)
    required: false
    validation:
      min: 0
      max: 25000
    validation_error: "Must enter UACR between 0 - 25000 mg/g"

  - id: 12
    code: "hba1c"
    text: "What is the value of your HbA1c?"
    type: number
    required: false
    validation:
      min: 3
      max: 15
    validation_error: "Must enter a value between 3 and 15."

  - id: 13
    code: "wealth-level"
    text: "Which best describes your financial situation?"
    type: single_choice
    options:
      - text: "Comfortable"
        value: "rich"

      - text: "Getting by"
        value: "middle"

      - text: "Struggling financially"
        value: "poor"

    required: false
    validation:
      min: 0
      max:
    validation_error: "Must enter  between "

provider_section:
  title: "For Healthcare Provider Use Only"
  fields:
    - id: calculated_risk
      text: "Calculated 10-year ASCVD risk"
      type: number
      unit: "%"
    - id: risk_category
      text: "Risk Category"
      type: single_choice
      options:
        - value: low
          text: "Low (<5%)"
        - value: borderline
          text: "Borderline (5–7.4%)"
        - value: intermediate
          text: "Intermediate (7.5–19.9%)"
        - value: high
          text: "High (≥20%)"
