title: "Diabetes Risk Assessment"
version: "1.0"

questions:
  - id: 1
    code: "age"
    text: "What is your age?"
    type: Number
    save:
      path: "age"
      cast: "int"

  - id: 2
    code: "gender"
    text: "What is your gender?"
    type: single_choice
    options:
      - text: Female
        value: Female
      - text: Male
        value: Male
    save:
      path: "gender"
      cast: "string"

  - id: 3
    code: "gdm-macrosomia"
    text: "Have you ever had gestational diabetes OR given birth to a baby weighing 9 pounds or more?"
    type: single_choice
    showIf:
      - questionId: 2
        operator: equals
        value: Female
    options:
      - text: Yes
        value: yes

      - text: No
        value: no

    defaultAnswer:
      text: No
      value: no

    save:
      path: "gestational-diabetes"
      cast: "bool"

  - id: 4
    code: "diabetes-family-history"
    text: "Do you have a parent, brother, or sister with diabetes?"
    type: single_choice
    options:
      - text: Yes
        value: yes

      - text: No
        value: no

  - id: 5
    code: "on-bp-med"
    text: "Have you ever been diagnosed with high blood pressure or are you on medication for high blood pressure?"
    type: single_choice
    options:
      - text: Yes
        value: yes

      - text: No
        value: no
    save:
      path: "blood-pressure"
      cast: "float"

  - id: 6
    code: "active-lifestyle"
    text: "Are you physically active?"
    type: single_choice
    options:
      - text: Yes
        value: yes

      - text: No
        value: no

  - id: 7
    code: "height"
    text: "What is your height in meters?"
    type: Number
    save:
      path: "height"
      cast: float
      unit: "m"

  - id: 8
    code: "weight"
    text: "What is your weight (kg)?"
    type: Number
    save:
      path: "weight"
      cast: float
      unit: "kg"
