title: "Estimated 10-year fracture probability Risk Assessment"
version: "1.0"

questions:
  - id: 1
    code: "age"
    text: "What is your age?"
    type: Number
    save:
      path: "age"
      cast: "int"
    validation:
      min: 40
      max: 90
    validation_error: "You must be between 40 and 90 years."

  - id: 2
    code: "gender"
    text: "What is your gender?"
    type: single_choice
    options:
      - text: Female
        value: Female
      - text: Male
        value: Male
    save:
      path: "gender"
      cast: "string"

  - id: 3
    code: "height"
    text: "What is your height in meters?"
    type: Number
    save:
      path: "height"
      cast: float
      unit: "m"
    validation:
      min: 1.5
      max: 2.2
    validation_error: "Height must be 1.5 to 2.2 meters."

  - id: 4
    code: "weight"
    text: "What is your weight (kg)?"
    type: Number
    save:
      path: "weight"
      cast: float
      unit: "kg"
    validation:
      min: 50
      max: 150
    validation_error: "Weight must be 50 to 150 kilograms."

  - id: 5
    code: "previous-fracture"
    text: "Have you had previous fracture?"
    type: single_choice
    options:
      - text: Yes
        value: yes

      - text: No
        value: no
    required: false

  - id: 6
    code: "parent-hip-fracture"
    text: "Have you had previous parent fracture hip?"
    type: single_choice
    options:
      - text: Yes
        value: yes

      - text: No
        value: no
    required: false

  - id: 7
    code: "smoking"
    text: "Are you Smoking?"
    type: single_choice
    options:
      - text: Yes
        value: yes

      - text: No
        value: no
    save:
      path: "smoking"
      cast: "bool"
    required: false

  - id: 8
    code: "corticosteroids"
    text: "Are you currently taking any corticosteroids?"
    type: single_choice
    options:
      - text: Yes
        value: yes

      - text: No
        value: no
    required: false

  - id: 9
    code: "rheumatoid-arthritis"
    text: "Do you have a confirmed diagnosis of rheumatoid arthritis?"
    type: single_choice
    options:
      - text: Yes
        value: yes

      - text: No
        value: no
    required: false

  - id: 10
    code: "secondary-osteoporosis"
    text: "Do you have a bone-weakening condition (diabetes, liver/kidney, thyroid, or early menopause)?"
    type: single_choice
    options:
      - text: Yes
        value: yes

      - text: No
        value: no
    required: false

  - id: 11
    code: "drink-alcohol-over-3-units-daily"
    text: "Do you drink 3 or more units of alcohol per day?"
    type: single_choice
    options:
      - text: Yes
        value: yes

      - text: No
        value: no
    required: false

results:
  - value: low
    text: "Low Risk"
    subtitle: "Your bone density is in a healthy range"
    conditions:
      - operator: equals
        value: "Low"
    description: "The estimation indicates a lower 10-year probability of a major osteoporotic fracture. This result does not by itself diagnose osteoporosis or determine whether treatment is needed."
    color: "#4CAF50"
    icon: "🟢"
    prevention:
      primordial:
        - "Maintain a healthy body weight."
        - "Stay physically active."
      primary:
        - "Include adequate calcium and vitamin D in your diet."
        - "Perform regular weight-bearing and muscle-strengthening exercise."
      secondary:
        - "Discuss your individual fracture risk with your healthcare professional if you have additional risk factors."
    summary: "Your 10-year fracture estimates come out to {0} for a major osteoporotic fracture and {1} for a hip fracture, which places you in the lower-risk band of this assessment."
    next_steps: |
      1. Continue regular physical activity.
      2. Maintain adequate calcium and vitamin D intake.
      3. Review your risk factors periodically.
    follow_up: "Reassess your fracture risk when your health or risk factors change."
    patient_education: |
      • Assessment estimates the probability of fracture over the next 10 years.
      • A lower probability does not mean that fracture is impossible.

  - value: medium
    text: "Medium Risk"
    subtitle: "Some early signs of bone loss detected"
    conditions:
      - operator: equals
        value: "Medium"
    description: "The estimation indicates an intermediate 10-year probability of a major osteoporotic fracture. The result should be interpreted together with age, sex, clinical risk factors and, when available, bone mineral density."
    color: "#FF9800"
    icon: "🟠"
    prevention:
      primordial:
        - "Maintain a healthy body weight."
        - "Avoid prolonged physical inactivity."
      primary:
        - "Perform regular weight-bearing and muscle-strengthening exercise."
        - "Ensure adequate calcium and vitamin D intake."
        - "Avoid smoking and excessive alcohol consumption."
      secondary:
        - "Discuss your result and additional risk factors with a healthcare professional."
        - "Ask whether bone mineral density testing is appropriate for you."
    summary: "Your 10-year fracture estimates are {0} for a major osteoporotic fracture and {1} for a hip fracture, which places you in the moderate-risk band of this assessment."
    next_steps: |
      1. Review your fracture risk factors with a healthcare professional.
      2. Maintain regular weight-bearing and muscle-strengthening exercise.
      3. Discuss whether further assessment, including BMD measurement, is appropriate.
    follow_up: "Follow up according to your healthcare professional's assessment."
    patient_education: |
      • Assessment provides an estimated 10-year fracture probability.
      • Clinical decisions should not be based on the percentage alone.
      • Bone mineral density can provide additional information when appropriate.

  - value: high
    text: "High Risk"
    subtitle: "Fracture prevention is now a priority"
    conditions:
      - operator: equals
        value: "High"
    description: "The estimation indicates a higher 10-year probability of a major osteoporotic fracture according to this questionnaire's risk bands. This result should be reviewed with a healthcare professional."
    color: "#F44336"
    icon: "🔴"
    prevention:
      primordial:
        - "Stay physically active and avoid prolonged inactivity."
        - "Maintain a healthy body weight."
      primary:
        - "Perform regular weight-bearing and muscle-strengthening exercise."
        - "Ensure adequate calcium and vitamin D intake."
        - "Avoid smoking and excessive alcohol consumption."
      secondary:
        - "Discuss your result with a healthcare professional."
        - "Discuss whether bone mineral density testing or other assessment is appropriate."
        - "Review modifiable fracture risk factors."
    summary: "Based on this questionnaire, your 10-year risk scores are {0} for a major osteoporotic fracture and {1} for a hip fracture, both of which are at the higher end of the scale. Please contact with your health care provider."
    next_steps: |
      1. Discuss the result with a healthcare professional.
      2. Review your individual fracture risk factors.
      3. Ask whether further evaluation, including BMD measurement, is appropriate.
    follow_up: "Arrange follow-up with a healthcare professional for individualized assessment."
    patient_education: |
      • A higher probability does not by itself establish a diagnosis of osteoporosis.
      • Treatment decisions depend on the complete clinical picture.
      • Assessment estimates 10-year fracture probability and should be interpreted in its clinical context.
