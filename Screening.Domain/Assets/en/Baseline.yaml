title: "Baseline Assessment"
version: "1.0"

questions:
  - id: 1
    code: "age"
    text: "What is your age?"
    type: Number
    save:
      path: "age"
      cast: int

  - id: 2
    code: "gender"
    text: "What is your gender?"
    type: single_choice
    options:
      - text: Female
        value: Female
      - text: Male
        value: Male
    save:
      path: "gender"
      cast: string

  - id: 3
    code: "height"
    text: "What is your height in meters?"
    type: Number
    Save:
      path: "height"
      cast: float
      unit: "m"

  - id: 4
    code: "weight"
    text: "What is your weight in Kilograms?"
    type: Number
    Save:
      path: "weight"
      cast: float
      unit: "kg"
